<!DOCTYPE html>

<html>

<head>
<title>Search Results</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#f4f6f9;
margin:0;
padding:40px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#333;
margin-bottom:30px;
}

.result-card{
border:1px solid #e3e3e3;
border-radius:8px;
padding:20px;
margin-bottom:20px;
background:#fafafa;
}

.source{
font-weight:bold;
color:#007bff;
margin-bottom:10px;
}

.text{
color:#444;
line-height:1.6;
}

.no-result{
text-align:center;
color:#777;
margin-top:20px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:12px 20px;
background:#007bff;
color:white;
text-decoration:none;
border-radius:6px;
transition:0.3s;
}

.btn:hover{
background:#0056b3;
}

.center{
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Search Results for "{{ query }}"</h2>

{% if results %}

```
{% for r in results %}

    <div class="result-card">

        <div class="source">Source: {{ r.source }}</div>

        <div class="text">
            {{ r.text }}
        </div>

    </div>

{% endfor %}
```

{% else %}

```
<div class="no-result">
    No results found.
</div>
```

{% endif %}

<div class="center">
<a class="btn" href="/">Back to Home</a>
</div>

</div>

</body>

</html>
